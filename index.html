<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GD Rankings Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #0a0a12; color: #fff; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        h1 { color: #00f3ff; text-shadow: 0 0 15px #00f3ff; margin-bottom: 20px; font-size: 2rem; text-align: center; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        .tab-btn { background: #121225; border: 2px solid #00f3ff; color: #00f3ff; padding: 10px 18px; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .tab-btn:hover, .tab-btn.active { background: #00f3ff; color: #0a0a12; box-shadow: 0 0 15px #00f3ff; }
        
        .container { width: 100%; max-width: 900px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; background: #121225; border-radius: 10px; overflow: hidden; box-shadow: 0 0 10px rgba(0,243,255,0.2); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #1a1a3a; }
        th { background: #181835; color: #ff007f; text-shadow: 0 0 5px #ff007f; text-transform: uppercase; font-size: 0.9rem; }
        tr:hover { background: #1c1c40; }
        
        .rank { font-weight: bold; color: #ffea00; text-shadow: 0 0 5px #ffea00; width: 60px; }
        .name { font-weight: bold; color: #fff; }
        .sub { color: #8a8ab5; font-size: 0.85rem; }
    </style>
</head>
<body>

    <h1>GEOMETRY DASH RANKINGS HUB</h1>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('demons', this)">Demon List Main</button>
        <button class="tab-btn" onclick="showTab('players', this)">Top Players</button>
        <button class="tab-btn" onclick="showTab('ill', this)">ILL Top 50</button>
    </div>

    <div class="container">
        <!-- DEMON LIST -->
        <div id="demons" class="tab-content active">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Livello</th>
                        <th>Publisher</th>
                        <th>Verifier</th>
                    </tr>
                </thead>
                <tbody id="demon-tbody"></tbody>
            </table>
        </div>

        <!-- TOP PLAYERS -->
        <div id="players" class="tab-content">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Giocatore</th>
                        <th>Punteggio</th>
                        <th>Nazione</th>
                    </tr>
                </thead>
                <tbody id="player-tbody"></tbody>
            </table>
        </div>

        <!-- ILL LIST -->
        <div id="ill" class="tab-content">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Livello Impossible</th>
                        <th>Creatori</th>
                        <th>FPS / Dettagli</th>
                    </tr>
                </thead>
                <tbody id="ill-tbody"></tbody>
            </table>
        </div>
    </div>

    <script>
        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        async function loadData() {
            try {
                const response = await fetch('gd_rankings_database.json');
                const data = await response.json();

                // Demon List
                const demonTbody = document.getElementById('demon-tbody');
                demonTbody.innerHTML = '';
                const demons = data.demon_list_main || data.demon_list || [];
                demons.forEach(item => {
                    demonTbody.innerHTML += `
                        <tr>
                            <td class="rank">#${item.rank || '-'}</td>
                            <td class="name">${item.name || item.level || '-'}</td>
                            <td class="sub">${item.publisher || item.creator || '-'}</td>
                            <td class="sub">${item.verifier || '-'}</td>
                        </tr>`;
                });

                // Top Players (Lettura flessibile delle chiavi JSON)
                const playerTbody = document.getElementById('player-tbody');
                playerTbody.innerHTML = '';
                const players = data.top_players || data.players || [];
                players.forEach(item => {
                    const name = item.name || item.player || item.username || 'Sconosciuto';
                    const score = item.score || item.points || item.punti || '-';
                    const country = item.nationality || item.country || item.nazione || 'INT';
                    
                    playerTbody.innerHTML += `
                        <tr>
                            <td class="rank">#${item.rank || '-'}</td>
                            <td class="name">${name}</td>
                            <td class="sub">${score} pts</td>
                            <td class="sub">${country}</td>
                        </tr>`;
                });

                // ILL List
                const illTbody = document.getElementById('ill-tbody');
                illTbody.innerHTML = '';
                const ill = data.impossible_levels_list || data.ill_list || [];
                ill.forEach(item => {
                    illTbody.innerHTML += `
                        <tr>
                            <td class="rank">#${item.rank || '-'}</td>
                            <td class="name">${item.name || '-'}</td>
                            <td class="sub">${item.creators || item.creator || 'Community'}</td>
                            <td class="sub">${item.tps_fps || item.fps || '360 FPS'}</td>
                        </tr>`;
                });

            } catch (err) {
                console.error("Errore nel caricamento del file JSON:", err);
            }
        }

        loadData();
    </script>
</body>
</html>
